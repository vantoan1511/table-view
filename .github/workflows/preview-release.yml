name: Preview Release Table View

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'extensions/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'neutralino.config.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

jobs:
  build-and-preview-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'extensions/db-bridge'
          cache-all-crates: true

      - name: Install Dependencies
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: Install Tools
        run: |
          npm install -g @neutralinojs/neu
          neu update

      - name: Build Backend and Frontend
        shell: bash
        run: npm run neu:build

      - name: Compute Preview Version & Build Installer
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./neutralino.config.json').version")
          PREVIEW_VERSION="$BASE_VERSION-preview.${{ github.run_number }}"
          echo "Building installer for preview version $PREVIEW_VERSION"
          echo "PREVIEW_VERSION=$PREVIEW_VERSION" >> $GITHUB_ENV
          node scripts/build-installer.js $PREVIEW_VERSION

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PREVIEW_VERSION }}
          name: v${{ env.PREVIEW_VERSION }}
          prerelease: true
          files: |
            dist/table-view/resources.neu
            bin/db-bridge.exe
            Output/setup.exe
          body: "Automated preview release from latest main branch (commit ${{ github.sha }})."
          generate_release_notes: false

      - name: Update manifest-preview.json for Preview Auto-Updater
        shell: bash
        run: |
          VERSION="${{ env.PREVIEW_VERSION }}"
          TAG_NAME="v${VERSION}"
          echo "Updating manifest-preview.json version to $VERSION and tag $TAG_NAME"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]"

          git reset --hard
          git fetch origin main
          git checkout main
          git pull origin main --rebase

          node -e "
            const fs = require('fs');
            const manifest = {
              applicationId: 'com.github.vantoan1511.tableview',
              version: '${VERSION}',
              resourcesURL: 'https://github.com/vantoan1511/table-view/releases/download/${TAG_NAME}/resources.neu',
              data: {
                extensionUrl: 'https://github.com/vantoan1511/table-view/releases/download/${TAG_NAME}/db-bridge.exe',
                releaseNotes: 'Automated preview release update.'
              }
            };
            fs.writeFileSync('manifest-preview.json', JSON.stringify(manifest, null, 2));
          "

          git add manifest-preview.json
          git commit -m "chore: update manifest-preview.json for preview v$VERSION [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main"

      - name: Prune Old Preview Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $KEEP_COUNT = 5
          Write-Host "Fetching list of preview releases..."
          $releasesRaw = gh release list --limit 100 --json tagName,isPrerelease
          if (-not $releasesRaw) { return }

          $previewReleases = @($releasesRaw | ConvertFrom-Json | Where-Object { $_.isPrerelease -and $_.tagName -like "*preview*" })

          Write-Host "Found $($previewReleases.Count) preview release(s)."
          if ($previewReleases.Count -gt $KEEP_COUNT) {
            $toDelete = $previewReleases | Select-Object -Skip $KEEP_COUNT
            foreach ($rel in $toDelete) {
              $tag = $rel.tagName
              Write-Host "Deleting old preview release and tag: $tag"
              gh release delete $tag --yes --cleanup-tag
            }
          } else {
            Write-Host "Preview release count is within the limit ($KEEP_COUNT)."
          }

