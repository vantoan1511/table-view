name: Release Table View

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'extensions/db-bridge'
          # Cache size is limited, so we only cache the necessary bits
          cache-all-crates: true

      - name: Install Dependencies
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: Install Tools
        run: |
          npm install -g @neutralinojs/neu
          neu update

      - name: Build Backend and Frontend
        shell: bash
        run: |
          # Start Rust build in background
          cd extensions/db-bridge
          cargo build --release &
          RUST_PID=$!
          cd ../..
          # Build Frontend
          neu build --release
          # Wait for Rust build to finish
          wait $RUST_PID
          cp extensions/db-bridge/target/release/db-bridge.exe extensions/db-bridge/

      - name: Build Windows Installer
        shell: pwsh
        run: |
          # Extract version for the installer
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $VERSION = "${{ github.ref }}".Replace("refs/tags/v", "")
          } else {
            $VERSION = node -p "require('./neutralino.config.json').version"
          }
          Write-Host "Building installer for version $VERSION"
          ./scripts/build-installer.ps1 -Version $VERSION

      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          # Get version from ref or config
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./neutralino.config.json').version")
          fi

          echo "Extracting notes for version $VERSION"

          # Extract section between the current version header and the next header
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md

          # If file is empty (version not found or it's the last entry), handle it
          if [ ! -s release_notes.md ]; then
            sed -n "/## \[$VERSION\]/,\$p" CHANGELOG.md > release_notes.md
          fi

          # Final check
          if [ ! -s release_notes.md ]; then
            echo "No notes found for version $VERSION in CHANGELOG.md" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/table-view/resources.neu
            extensions/db-bridge/db-bridge.exe
            scripts/Output/setup.exe
          body_path: release_notes.md
          generate_release_notes: false

      - name: Submit to WinGet Community Repository
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: vantoan1511.TableView
          installers-regex: 'setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Update manifest.json for Auto-Updater
        shell: bash
        run: |
          # Extract version from tag or config
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./neutralino.config.json').version")
          fi

          echo "Updating manifest version to $VERSION"

          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]"

          # Clean up any build-time modifications to tracked files
          git reset --hard

          # Switch to main branch BEFORE modifying manifest.json to avoid checkout conflicts
          git fetch origin main
          git checkout main
          git pull origin main --rebase

          # Use node to only update the version number in manifest.json
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); manifest.version = '$VERSION'; fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));"

          # Commit and Push manifest.json only back to main
          git add manifest.json
          git commit -m "chore: update manifest.json for release v$VERSION [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main"
