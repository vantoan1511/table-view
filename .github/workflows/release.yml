name: Release Table View

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'extensions/db-bridge/go.mod'
          cache-dependency-path: extensions/db-bridge/go.sum

      - name: Install Dependencies
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: Install Tools
        run: |
          npm install -g @neutralinojs/neu
          neu update

      - name: Build Go Extension (Windows)
        shell: bash
        run: |
          cd extensions/db-bridge
          GOOS=windows GOARCH=amd64 go build -o db-bridge.exe ./main.go

      - name: Build Application (Neutralino)
        run: neu build --release

      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          # Get version from ref or config
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./neutralino.config.json').version")
          fi
          
          echo "Extracting notes for version $VERSION"
          
          # Extract section between the current version header and the next header
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          
          # If file is empty (version not found or it's the last entry), handle it
          if [ ! -s release_notes.md ]; then
            sed -n "/## \[$VERSION\]/,\$p" CHANGELOG.md > release_notes.md
          fi
          
          # Final check
          if [ ! -s release_notes.md ]; then
            echo "No notes found for version $VERSION in CHANGELOG.md" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/table-view/resources.neu
            extensions/db-bridge/db-bridge.exe
          body_path: release_notes.md
          generate_release_notes: false

      - name: Update manifest.json for Auto-Updater
        shell: bash
        run: |
          # Extract version from tag or config
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./neutralino.config.json').version")
          fi
          
          echo "Updating manifest to version $VERSION pointing to Release Assets"
          
          # Use node to update manifest.json to point to Release Assets instead of main branch
          RELEASE_URL="https://github.com/vantoan1511/table-view/releases/download/v$VERSION"
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); manifest.version = '$VERSION'; manifest.resourcesURL = '$RELEASE_URL/resources.neu'; manifest.data.extensionUrl = '$RELEASE_URL/db-bridge.exe'; fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));"
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Commit and Push manifest.json only back to main
          git checkout main
          git add manifest.json
          git commit -m "chore: update manifest.json for release v$VERSION [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main"
