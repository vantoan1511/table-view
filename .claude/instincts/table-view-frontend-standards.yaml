# Table View Frontend Standards

## Action
- Use Pinia for global state.
- Use Lucide Vue Next for icons (imported explicitly in `<script setup>`).
- Maintain the dark-mode aesthetic with Tailwind CSS 4.
- Provide feedback via `toast` and `error` stores.

