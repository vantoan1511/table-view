<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table View</title>
  <script src="http://localhost:62473/__neutralino_globals.js"></script>
  <style>
    body { background: #0f172a; margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeInScale 0.6s ease-out;
    }
    .loader-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
    }
    .loader-logo svg { width: 32px; height: 32px; color: white; }
    .loader-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.05);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </div>
      <div class="loader-text">Table View</div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
