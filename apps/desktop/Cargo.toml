[package]
name = "table-view-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "table-view-desktop"
path = "src/main.rs"

[features]
default = []
native-ui = ["dep:gpui"]

[dependencies]
db-bridge = { path = "../../extensions/db-bridge" }
gpui = { version = "0.2.2", optional = true }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
