[package]
name = "db-bridge"
version = "0.7.1"
edition = "2021"

[lib]
name = "db_bridge"
path = "src/lib.rs"

[[bin]]
name = "db-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "uuid",
    "chrono",
    "json"
] }
hex = "0.4"
log = "0.4"
chrono = "0.4"
env_logger = "0.11"
directories = "6.0"
clap = { version = "4", features = ["derive"] }
csv = "1"
async-trait = "0.1"
urlencoding = "2"
# Official Oracle driver (beta release, pinned exactly until stable 26.x is released)
oracledb = "=26.0.0-beta.3"
rustls = { version = "0.23", features = ["ring"] }

[build-dependencies]
winres = "0.1"
