[package]
name = "db-bridge"
version = "0.6.9"
edition = "2021"

[[bin]]
name = "db-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "uuid",
    "chrono",
    "json"
] }
hex = "0.4"
log = "0.4"
chrono = "0.4"
env_logger = "0.11"
directories = "6.0"
clap = { version = "4", features = ["derive"] }
csv = "1"
async-trait = "0.1"
urlencoding = "2"
oracle-rs = "0.1"
deadpool-oracle = "0.1"
rustls = { version = "0.23", features = ["ring"] }

[patch.crates-io]
oracle-rs = { path = "vendor/oracle-rs" }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3          # speed up compilation
lto = false            # avoid thin LTO compiler panic when linking PE resources
codegen-units = 1      # single codegen unit for clean release build
strip = false          # retain symbol table for AV trust and debugging
panic = "abort"        # abort on panic (smaller binary)
